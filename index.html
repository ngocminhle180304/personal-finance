<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17202a" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tài chính">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Tài chính cá nhân</title>
<style>
:root{--maxw:560px;--bg:#f3f6f8;--card:#fff;--tx:#14202b;--mut:#6b7885;--bd:#e3e8ee;--pri:#0f766e;--onpri:#fff;--inc:#16a34a;--exp:#dc2626;--warn:#d97706;--sh:0 1px 3px rgba(0,0,0,.08);--inp:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#0d1318;--card:#17202a;--tx:#e8eef3;--mut:#8a99a8;--bd:#263340;--pri:#2dd4bf;--onpri:#06231f;--inc:#4ade80;--exp:#f87171;--warn:#fbbf24;--sh:none;--inp:#101820}}
*{box-sizing:border-box}
html,body{margin:0;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
html{overscroll-behavior-y:none}
body{font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:90px}
h1,h2,h3{margin:0}
header{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--bd);padding-top:env(safe-area-inset-top)}
.top{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;max-width:var(--maxw);margin:auto}
.top h1{font-size:17px}
main{max-width:var(--maxw);margin:14px auto;padding:0 12px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;box-shadow:var(--sh)}
.card h3{font-size:14px;color:var(--mut);font-weight:600;margin-bottom:8px}
.big{font-size:26px;font-weight:800;letter-spacing:-.5px}
.mid{font-size:19px;font-weight:700}
.mut{color:var(--mut);font-size:13px}
.inc{color:var(--inc)}.exp{color:var(--exp)}.warn{color:var(--warn)}
.row{display:flex;gap:8px;align-items:center}
.sp{justify-content:space-between}
.end{justify-content:flex-end}
.wrap{flex-wrap:wrap}
.btn{border:0;background:var(--pri);color:var(--onpri);padding:9px 14px;border-radius:10px;font:inherit;font-weight:700;cursor:pointer}
.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.danger{background:var(--exp);color:#fff}
input,select,textarea{width:100%;font:inherit;color:var(--tx);background:var(--inp);border:1px solid var(--bd);border-radius:10px;padding:9px 10px}
.inline{width:auto}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
.pill{display:inline-block;border:1px solid var(--bd);background:transparent;color:var(--mut);border-radius:99px;padding:6px 12px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.pill.on{background:var(--pri);border-color:var(--pri);color:var(--onpri)}
.av{flex:0 0 38px;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--bd);cursor:pointer}
.item:last-child{border-bottom:0}
.item .l{min-width:0}
.item .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .r{text-align:right;white-space:nowrap;font-weight:700}
.day{font-size:12px;color:var(--mut);font-weight:700;margin:12px 4px 2px;text-transform:uppercase}
.bar{height:8px;border-radius:99px;background:var(--bd);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--pri);border-radius:99px}
.bar i.over{background:var(--exp)}.bar i.near{background:var(--warn)}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--bd);color:var(--mut)}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;border:0;background:var(--pri);color:var(--onpri);font-size:30px;line-height:1;box-shadow:0 4px 14px rgba(0,0,0,.3);cursor:pointer;z-index:30}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:50}
#modal.open{display:flex}
.sheet{background:var(--card);width:100%;max-width:520px;max-height:92vh;max-height:92dvh;overflow:auto;overscroll-behavior:contain;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.sheet form .row{margin-top:16px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#111;color:#fff;padding:9px 16px;border-radius:99px;font-size:14px;z-index:60;display:none;max-width:90%}
#toast.err{background:var(--exp)}
.chartbox{position:relative;height:260px}
.empty{text-align:center;color:var(--mut);padding:26px 8px}
.loading{position:fixed;top:0;left:0;right:0;height:3px;background:var(--pri);z-index:99;display:none;animation:ld 1s infinite}
@keyframes ld{0%{transform:scaleX(.05);transform-origin:left}50%{transform:scaleX(1);transform-origin:left}100%{transform:scaleX(0);transform-origin:right}}
.mnav{display:flex;align-items:center;gap:6px}
.mnav input{width:auto}
/* ===== Mobile / app ===== */
.more .item{font-size:16px;padding:14px 4px}
.install{display:none}
/* Luôn dùng bố cục mobile (1 cột, tab dưới đáy), kể cả trên máy tính */
body{padding-bottom:calc(150px + env(safe-area-inset-bottom))}
.top{padding:10px 14px}
main{margin-top:12px}
input,select,textarea{font-size:16px;padding:11px 12px}  /* >=16px: iOS không tự zoom khi chạm vào ô nhập */
.btn{padding:11px 16px}
.btn.sm{padding:7px 12px}
.item{padding:13px 4px}
.g2,.g3{grid-template-columns:1fr}
.g3.kpi{grid-template-columns:1fr 1fr}
.big{font-size:28px}
.chartbox{height:230px}
.bnav{display:flex;position:fixed;left:50%;transform:translateX(-50%);width:100%;max-width:var(--maxw);bottom:0;z-index:40;background:var(--card);border-top:1px solid var(--bd);padding:4px 4px env(safe-area-inset-bottom)}
.bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;border:0;background:transparent;color:var(--mut);font:inherit;font-size:11px;font-weight:600;padding:6px 0 4px;cursor:pointer;min-height:52px}
.bnav button b{font-size:21px;line-height:1.2;filter:grayscale(1);opacity:.75}
.bnav button.on{color:var(--pri)}
.bnav button.on b{filter:none;opacity:1}
.fab{bottom:calc(76px + env(safe-area-inset-bottom));right:max(18px, calc((100vw - var(--maxw)) / 2 + 18px))}
#toast{bottom:calc(146px + env(safe-area-inset-bottom))}
.sheet form .row.sp{position:sticky;bottom:calc(-16px - env(safe-area-inset-bottom));background:var(--card);padding:12px 0 4px;margin-bottom:-4px}
@media(display-mode:standalone){.install{display:none!important}}
</style>
</head>
<body>
<div class="loading" id="loading"></div>
<header>
  <div class="top">
    <h1>💰 Tài chính cá nhân</h1>
    <div class="row"><span class="mut" id="sync"></span><button class="btn ghost sm" id="btnReload" title="Tải lại dữ liệu">⟳</button></div>
  </div>
</header>
<main id="view"></main>
<button class="fab" id="fab" title="Thêm giao dịch">+</button>
<div id="modal"></div>
<div id="toast"></div>
<nav class="bnav" id="bnav"></nav>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
/* ============ CẤU HÌNH ============ */
// (Tùy chọn) dán URL Web App vào đây để khỏi nhập lại ở mỗi thiết bị. Token thì KHÔNG nên ghi vào code.
const DEFAULT_API_URL = '';

/* ============ TIỆN ÍCH ============ */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf = new Intl.NumberFormat('vi-VN');
const vnd = n => nf.format(Math.round(n || 0)) + ' ₫';
const num = x => Number(x) || 0;
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const pad = n => String(n).padStart(2, '0');
const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const cssv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

const ACC_TYPES = { bank: 'Ngân hàng', cash: 'Tiền mặt', ewallet: 'Ví điện tử', invest: 'Đầu tư', credit: 'Thẻ tín dụng', other: 'Khác' };
const ACC_ICON = { bank: '🏦', cash: '💵', ewallet: '📱', invest: '📈', credit: '💳', other: '👛' };
const KEYS = ['Accounts', 'Categories', 'Transactions', 'Debts', 'DebtPayments', 'Budgets', 'Recurring'];

let cfg = JSON.parse(localStorage.getItem('fin_cfg') || '{}');
if (!cfg.url && DEFAULT_API_URL) cfg.url = DEFAULT_API_URL;
let S = {}; KEYS.forEach(k => S[k] = []);
const ui = { view: 'dash', month: todayStr().slice(0, 7), f: { acc: '', type: '', q: '' } };
let charts = [];

/* ============ API ============ */
let busy = 0;
function spin(on) { busy += on ? 1 : -1; $('#loading').style.display = busy > 0 ? 'block' : 'none'; }
async function api(action, payload = {}) {
  if (!cfg.url || !cfg.token) throw new Error('Chưa cấu hình URL / token');
  if (!navigator.onLine) throw new Error('Đang offline — chưa lưu được, thử lại khi có mạng');
  spin(true);
  try {
    let res;
    try { res = await fetch(cfg.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ token: cfg.token, action, ...payload }) }); }
    catch (e) { throw new Error('Không kết nối được Apps Script. Mở thử URL Web App trong tab mới: phải thấy "API đang chạy". Nếu bị đòi đăng nhập → Deploy lại với quyền Anyone + New version; URL phải kết thúc bằng /exec.'); }
    const j = await res.json();
    if (!j.ok) throw new Error(j.error || 'Lỗi không xác định');
    return j.data;
  } finally { spin(false); }
}
function toast(msg, err) {
  const t = $('#toast'); t.textContent = msg; t.className = err ? 'err' : ''; t.style.display = 'block';
  clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = 'none', err ? 4500 : 2200);
}
function persist() { try { localStorage.setItem('fin_cache', JSON.stringify(S)); } catch (e) {} }

let lastSync = 0;
async function loadAll(silent) {
  lastSync = Date.now();
  try {
    const d = await api('getAll');
    KEYS.forEach(k => S[k] = d[k] || []);
    persist();
    $('#sync').textContent = 'Đã đồng bộ ' + new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });
    render();
  } catch (e) { if (!silent) toast(e.message, true); $('#sync').textContent = 'Offline'; }
}
async function save(sheet, row) {
  await api('upsert', { sheet, row });
  const arr = S[sheet], i = arr.findIndex(x => x.id === row.id);
  if (i >= 0) arr[i] = row; else arr.push(row);
  persist(); render();
}
async function del(sheet, id) {
  await api('delete', { sheet, id });
  S[sheet] = S[sheet].filter(x => x.id !== id);
  if (sheet === 'Debts') S.DebtPayments = S.DebtPayments.filter(p => p.debt_id !== id);
  persist(); render();
}

/* ============ TÍNH TOÁN ============ */
const accById = id => S.Accounts.find(a => a.id === id);
const debtById = id => S.Debts.find(d => d.id === id);
const activeAccs = () => S.Accounts.filter(a => num(a.active) !== 0 || a.active === '' );
const catsOf = type => S.Categories.filter(c => c.type === type).map(c => c.name);

function balances() {
  const b = {}; S.Accounts.forEach(a => b[a.id] = num(a.initial_balance));
  const add = (id, v) => { if (id in b) b[id] += v; };
  S.Transactions.forEach(t => {
    const m = num(t.amount);
    if (t.type === 'income') add(t.account_id, m);
    else if (t.type === 'expense') add(t.account_id, -m);
    else if (t.type === 'transfer') { add(t.account_id, -m); add(t.to_account_id, m); }
  });
  S.Debts.forEach(d => { if (d.account_id) add(d.account_id, d.direction === 'lend' ? -num(d.amount) : num(d.amount)); });
  S.DebtPayments.forEach(p => { const d = debtById(p.debt_id); if (d && p.account_id) add(p.account_id, d.direction === 'lend' ? num(p.amount) : -num(p.amount)); });
  return b;
}
function debtPaid(id) { return S.DebtPayments.filter(p => p.debt_id === id).reduce((s, p) => s + num(p.amount), 0); }
function debtLeft(d) { return Math.max(0, num(d.amount) - debtPaid(d.id)); }
const pkey = n => String(n || '').trim().toLowerCase();
const AV_COLORS = ['#0f766e', '#2563eb', '#d97706', '#7c3aed', '#db2777', '#059669', '#ea580c', '#0891b2'];
function avatar(name) {
  const n = String(name || '?').trim(), c = AV_COLORS[[...n].reduce((s, ch) => s + ch.charCodeAt(0), 0) % AV_COLORS.length];
  return `<div class="av" style="background:${c}">${esc(([...n][0] || '?').toUpperCase())}</div>`;
}
// Gom sổ nợ theo người: mỗi người như một "tài khoản" công nợ. net > 0: họ nợ tôi; net < 0: tôi nợ họ.
function people() {
  const m = {};
  S.Debts.forEach(d => {
    const k = pkey(d.person); if (!k) return;
    const p = m[k] || (m[k] = { key: k, name: String(d.person).trim(), first: String(d.date), recv: 0, pay: 0, lent: 0, borrowed: 0, debts: [], last: '', late: false });
    const left = debtLeft(d);
    if (d.direction === 'lend') { p.recv += left; p.lent += num(d.amount); } else { p.pay += left; p.borrowed += num(d.amount); }
    if (left > 0 && d.due_date && d.due_date < todayStr()) p.late = true;
    p.debts.push(d);
    if (String(d.date) < p.first) { p.first = String(d.date); p.name = String(d.person).trim(); } // tên hiển thị = cách viết ở khoản đầu tiên
    if (String(d.date) > p.last) p.last = String(d.date);
    S.DebtPayments.forEach(x => { if (x.debt_id === d.id && String(x.date) > p.last) p.last = String(x.date); });
  });
  return Object.values(m).map(p => ({ ...p, net: p.recv - p.pay })).sort((a, b) => Math.abs(b.net) - Math.abs(a.net) || b.last.localeCompare(a.last));
}
const personByKey = k => people().find(p => p.key === k);
function personRow(p) {
  const st = p.net > 0 ? `<div class="r inc">${vnd(p.net)}</div>` : p.net < 0 ? `<div class="r exp">−${vnd(-p.net)}</div>` : '<div class="r mut">0 ₫</div>';
  const sub = p.net > 0 ? 'Đang nợ tôi' : p.net < 0 ? 'Tôi đang nợ' : 'Đã thanh toán xong';
  return `<div class="item" data-act="person" data-id="${esc(p.key)}"><div class="row" style="min-width:0">${avatar(p.name)}<div class="l"><div class="t">${esc(p.name)} ${p.late ? '<span class="chip exp">Quá hạn</span>' : ''}</div><div class="mut">${sub}${p.recv > 0 && p.pay > 0 ? ` · thu ${vnd(p.recv)} / trả ${vnd(p.pay)}` : ''}</div></div></div>${st}</div>`;
}
function debtTotals() {
  let recv = 0, pay = 0;
  S.Debts.forEach(d => { if (d.direction === 'lend') recv += debtLeft(d); else pay += debtLeft(d); });
  return { recv, pay };
}
function monthStats(prefix) {
  let inc = 0, exp = 0;
  S.Transactions.forEach(t => {
    if (!String(t.date).startsWith(prefix)) return;
    if (t.type === 'income') inc += num(t.amount); else if (t.type === 'expense') exp += num(t.amount);
  });
  return { inc, exp };
}
function spentByCat(prefix) {
  const m = {};
  S.Transactions.forEach(t => { if (t.type === 'expense' && String(t.date).startsWith(prefix)) m[t.category] = (m[t.category] || 0) + num(t.amount); });
  return m;
}

/* ============ MODAL FORM ============ */
function closeModal() { $('#modal').classList.remove('open'); $('#modal').innerHTML = ''; }
function fieldHtml(f, val, ctx) {
  const v = val ?? f.def ?? '';
  let inp;
  if (f.type === 'select') inp = `<select name="${f.k}">${optHtml(f.optsFn ? f.optsFn(ctx || {}) : (f.opts || []), v)}</select>`;
  else if (f.type === 'textarea') inp = `<textarea name="${f.k}" rows="2">${esc(v)}</textarea>`;
  else inp = `<input name="${f.k}" type="${f.type || 'text'}" value="${esc(v)}" ${f.type === 'number' ? 'inputmode="decimal" step="any"' : ''} ${f.ph ? `placeholder="${esc(f.ph)}"` : ''} ${f.list ? `list="dl_${f.k}"` : ''}>`
    + (f.list ? `<datalist id="dl_${f.k}">${f.list().map(x => `<option value="${esc(x)}">`).join('')}</datalist>` : '');
  return `<div data-fk="${f.k}"><label>${esc(f.label)}${f.req ? ' *' : ''}</label>${inp}</div>`;
}
function optHtml(opts, v) { return opts.map(o => `<option value="${esc(o.v)}" ${String(o.v) === String(v) ? 'selected' : ''}>${esc(o.l)}</option>`).join(''); }

function openForm({ title, fields, values = {}, onSave, onDelete, saveLabel }) {
  const m = $('#modal');
  const ctx0 = Object.fromEntries(fields.map(x => [x.k, values[x.k] ?? x.def ?? '']));
  m.innerHTML = `<div class="sheet"><h3 style="margin-bottom:4px">${esc(title)}</h3><form id="f" autocomplete="off">${fields.map(f => fieldHtml(f, values[f.k], ctx0)).join('')}
    <div class="row sp"><div>${onDelete ? '<button type="button" class="btn danger" data-del>Xóa</button>' : ''}</div>
    <div class="row"><button type="button" class="btn ghost" data-close>Hủy</button><button class="btn" type="submit">${saveLabel || 'Lưu'}</button></div></div></form></div>`;
  m.classList.add('open');
  const form = $('#f');
  const read = () => {
    const v = {};
    fields.forEach(f => {
      const el = form.elements[f.k]; if (!el) return;
      const wrap = form.querySelector(`[data-fk="${f.k}"]`);
      const hidden = wrap.style.display === 'none';
      v[f.k] = hidden ? '' : (f.type === 'number' ? (el.value === '' ? '' : Number(el.value)) : el.value.trim());
    });
    return v;
  };
  const sig = {};
  const upd = () => {
    const raw = {}; fields.forEach(f => { const el = form.elements[f.k]; if (el) raw[f.k] = f.type === 'number' ? el.value : el.value; });
    fields.forEach(f => {
      const wrap = form.querySelector(`[data-fk="${f.k}"]`);
      if (f.optsFn) {
        const opts = f.optsFn(raw), s = JSON.stringify(opts);
        if (sig[f.k] !== s) { const cur = form.elements[f.k].value; form.elements[f.k].innerHTML = optHtml(opts, cur); sig[f.k] = s; }
      }
      if (f.show) wrap.style.display = f.show(raw) ? '' : 'none';
      if (f.label2) wrap.querySelector('label').textContent = f.label2(raw);
    });
  };
  fields.forEach(f => { if (f.optsFn) sig[f.k] = JSON.stringify(f.optsFn(ctx0)); });
  form.addEventListener('input', upd); form.addEventListener('change', upd); upd();
  form.onsubmit = async e => {
    e.preventDefault();
    const v = read();
    for (const f of fields) {
      const wrap = form.querySelector(`[data-fk="${f.k}"]`);
      if (f.req && wrap.style.display !== 'none' && (v[f.k] === '' || v[f.k] === undefined)) { toast('Vui lòng nhập: ' + f.label, true); return; }
    }
    try { await onSave(v); closeModal(); toast('Đã lưu'); } catch (err) { toast(err.message, true); }
  };
  const d = form.querySelector('[data-del]');
  if (d) d.onclick = async () => { if (!confirm('Xóa mục này?')) return; try { await onDelete(); closeModal(); toast('Đã xóa'); } catch (err) { toast(err.message, true); } };
}
document.addEventListener('click', e => {
  if (e.target.matches('[data-close]') || e.target.id === 'modal') closeModal();
});

const accOpts = (blank) => { const o = activeAccs().map(a => ({ v: a.id, l: (ACC_ICON[a.type] || '') + ' ' + a.name })); return blank ? [{ v: '', l: blank }, ...o] : o; };

/* ============ FORMS ============ */
function txForm(t) {
  if (!activeAccs().length) { toast('Hãy tạo tài khoản trước', true); go('acc'); return; }
  const isNew = !t;
  t = t || { id: uid(), date: todayStr(), type: 'expense', account_id: activeAccs()[0].id };
  openForm({

  const row = a => `<div class="item" data-act="accedit" data-id="${a.id}"><div class="l"><div class="t">${ACC_ICON[a.type] || ''} ${esc(a.name)}</div><div class="mut">${ACC_TYPES[a.type] || ''}${a.note ? ' · ' + esc(a.note) : ''}</div></div><div class="r ${bal[a.id] < 0 ? 'exp' : ''}">${vnd(bal[a.id])}</div></div>`;
  return `<div class="row sp" style="margin-bottom:10px"><h2>Tài khoản</h2><button class="btn" data-act="accnew">+ Thêm</button></div>
  <div class="card" style="margin-bottom:12px"><h3>Tổng số dư các tài khoản</h3><div class="big">${vnd(total)}</div></div>
  <div class="card">${act.length ? act.map(row).join('') : '<div class="empty">Chưa có tài khoản nào. VD: MB Bank, Techcombank, Tiền mặt…</div>'}</div>
  ${(() => { const ps = people().filter(p => p.net !== 0); if (!ps.length) return '';
    const n = ps.reduce((s, p) => s + p.net, 0);
    return `<div class="row sp" style="margin:16px 4px 6px"><h3 class="mut" style="font-size:14px">🤝 Công nợ theo người</h3><b class="${n >= 0 ? 'inc' : 'exp'}">${n < 0 ? '−' : ''}${vnd(Math.abs(n))}</b></div><div class="card">${ps.map(personRow).join('')}</div><div class="mut" style="margin:6px 4px">Không cộng vào tổng số dư ở trên; đã tính trong tài sản ròng.</div>`; })()}
  ${hid.length ? `<h3 class="mut" style="margin:16px 4px 6px">Đã ẩn</h3><div class="card">${hid.map(row).join('')}</div>` : ''}`;
}

function viewDebt() {
  const { recv, pay } = debtTotals();
  const all = people(), f = ui.debtF || 'open';
  const list = all.filter(p => f === 'all' || (f === 'open' && (p.recv > 0 || p.pay > 0)) || (f === 'lend' && p.net > 0) || (f === 'borrow' && p.net < 0));
  const pill = (k, l) => `<button class="pill ${f === k ? 'on' : ''}" data-act="debtf" data-id="${k}">${l}</button>`;
  return `<div class="row sp" style="margin-bottom:10px"><h2>Sổ nợ</h2><button class="btn" data-act="debtnew">+ Thêm</button></div>
  <div class="grid g3 kpi" style="margin-bottom:12px"><div class="card"><h3>Người khác nợ tôi</h3><div class="mid inc">${vnd(recv)}</div></div><div class="card"><h3>Tôi nợ người khác</h3><div class="mid exp">${vnd(pay)}</div></div></div>
  <div class="row wrap" style="margin-bottom:10px">${pill('open', 'Đang nợ')}${pill('lend', 'Nợ tôi')}${pill('borrow', 'Tôi nợ')}${pill('all', 'Tất cả')}</div>
  <div class="card">${list.length ? list.map(personRow).join('') : `<div class="empty">${all.length ? 'Không có ai trong mục này' : 'Chưa có khoản nợ nào. Bấm “+ Thêm” để ghi khoản cho vay / đi vay.'}</div>`}</div>`;
}

function viewPerson() {
  const p = personByKey(ui.person);
  if (!p) { ui.view = 'debt'; return viewDebt(); }
  // Dòng thời gian: khoản vay/cho vay và các lần trả, kèm số dư lũy kế (dương = họ nợ tôi)
  const ev = [];
  p.debts.forEach(d => {
    ev.push({ date: String(d.date), kind: 'debt', d, delta: d.direction === 'lend' ? num(d.amount) : -num(d.amount) });
    S.DebtPayments.filter(x => x.debt_id === d.id).forEach(x => ev.push({ date: String(x.date), kind: 'pay', d, x, delta: d.direction === 'lend' ? -num(x.amount) : num(x.amount) }));
  });
  ev.sort((a, b) => a.date.localeCompare(b.date) || (a.kind === 'debt' ? -1 : 1));
  let run = 0; ev.forEach(e => { run += e.delta; e.run = run; });
  const accName = id => { const a = accById(id); return a ? ' · ' + esc(a.name) : ''; };
  const rows = ev.slice().reverse().map(e => {
    const late = e.kind === 'debt' && debtLeft(e.d) > 0 && e.d.due_date && e.d.due_date < todayStr();
    const title = e.kind === 'debt' ? (e.d.direction === 'lend' ? 'Cho vay' : 'Đi vay') + (late ? ' <span class="chip exp">Quá hạn</span>' : debtLeft(e.d) === 0 ? ' <span class="chip">Đã xong</span>' : '')
      : (e.d.direction === 'lend' ? 'Nhận trả' : 'Tôi trả');
    const note = e.kind === 'debt' ? e.d.note : e.x.note;
    const sub = `${e.date}${e.kind === 'debt' && e.d.due_date ? ' · hạn ' + e.d.due_date : ''}${accName(e.kind === 'debt' ? e.d.account_id : e.x.account_id)}${note ? ' · ' + esc(note) : ''}`;
    return `<div class="item" data-act="${e.kind === 'debt' ? 'debtedit' : 'payedit'}" data-id="${e.kind === 'debt' ? e.d.id : e.x.id}"><div class="l"><div class="t">${title}</div><div class="mut">${sub}</div></div>
      <div class="r"><div class="${e.delta > 0 ? 'inc' : 'exp'}">${e.delta > 0 ? '+' : '−'}${vnd(Math.abs(e.delta))}</div><div class="mut" style="font-weight:400">dư ${vnd(e.run)}</div></div></div>`;
  }).join('');
  const head = p.net > 0 ? `<h3>${esc(p.name)} đang nợ tôi</h3><div class="big inc">${vnd(p.net)}</div>` : p.net < 0 ? `<h3>Tôi đang nợ ${esc(p.name)}</h3><div class="big exp">${vnd(-p.net)}</div>` : `<h3>${esc(p.name)}</h3><div class="big mut">Đã xong</div>`;
  return `<div class="row" style="margin-bottom:10px"><button class="btn ghost sm" data-act="back">‹ Sổ nợ</button></div>
  <div class="card" style="margin-bottom:12px"><div class="row" style="gap:12px;align-items:flex-start">${avatar(p.name)}<div style="min-width:0">${head}</div></div>
    <div class="row wrap mut" style="margin-top:8px;gap:14px"><span>Đã cho vay: <b>${vnd(p.lent)}</b></span><span>Đã vay: <b>${vnd(p.borrowed)}</b></span>${p.recv > 0 && p.pay > 0 ? `<span>Họ còn nợ ${vnd(p.recv)} · tôi còn nợ ${vnd(p.pay)}</span>` : ''}</div></div>
  <div class="grid g3 kpi" style="margin-bottom:12px">
    ${p.recv > 0 ? `<button class="btn" data-act="ppay" data-id="lend">⬇ Nhận trả</button>` : ''}
    ${p.pay > 0 ? `<button class="btn" data-act="ppay" data-id="borrow">⬆ Trả nợ</button>` : ''}
    <button class="btn ghost" data-act="padd" data-id="lend">+ Cho vay thêm</button>
    <button class="btn ghost" data-act="padd" data-id="borrow">+ Mượn thêm</button>
  </div>
  <h3 class="mut" style="margin:4px 4px 6px;font-size:14px">Lịch sử</h3>
  <div class="card">${rows || '<div class="empty">Chưa có giao dịch</div>'}</div>`;
}

function viewBud() {
  const sp = spentByCat(ui.month);
  const list = S.Budgets.map(b => ({ ...b, spent: sp[b.category] || 0 }));
  const tb = list.reduce((s, b) => s + num(b.amount), 0), ts = list.reduce((s, b) => s + b.spent, 0);
  const unb = Object.keys(sp).filter(c => !S.Budgets.some(b => b.category === c));
  return `<div class="row sp wrap" style="margin-bottom:10px"><h2>Ngân sách</h2><div class="row">${monthNav()}<button class="btn" data-act="budnew">+ Thêm</button></div></div>
  <div class="card" style="margin-bottom:12px"><h3>Tổng ngân sách đã đặt</h3><div class="mid">${vnd(ts)} <span class="mut">/ ${vnd(tb)}</span></div></div>
  <div class="card">${list.length ? list.map(b => `<div data-act="budedit" data-id="${b.id}" style="cursor:pointer">${budBar(b)}</div>`).join('') : '<div class="empty">Chưa đặt ngân sách. Bấm “+ Thêm” để giới hạn chi tiêu theo danh mục mỗi tháng.</div>'}</div>
  ${unb.length ? `<div class="card" style="margin-top:12px"><h3>Chi tiêu chưa có ngân sách</h3>${unb.map(c => `<div class="row sp" style="padding:4px 0"><span>${esc(c)}</span><b>${vnd(sp[c])}</b></div>`).join('')}</div>` : ''}`;
}

function viewRec() {
  const fq = { monthly: 'Hàng tháng', weekly: 'Hàng tuần', yearly: 'Hàng năm' };
  return `<div class="row sp wrap" style="margin-bottom:10px"><h2>Chi phí định kỳ</h2><div class="row"><button class="btn ghost" data-act="recrun">▶ Chạy ngay</button><button class="btn" data-act="recnew">+ Thêm</button></div></div>
  <div class="card mut" style="margin-bottom:12px">Hệ thống tự tạo giao dịch mỗi ngày (khoảng 1h sáng) cho các khoản đến hạn. Bấm “Chạy ngay” để tạo ngay các khoản đã đến hạn.</div>
  <div class="card">${S.Recurring.length ? S.Recurring.map(r => {
    const a = accById(r.account_id);
    const when = r.frequency === 'monthly' ? `ngày ${r.day}` : r.frequency === 'weekly' ? '' : String(r.start_date).slice(5);
    return `<div class="item" data-act="recedit" data-id="${r.id}"><div class="l"><div class="t">${esc(r.name)} ${num(r.active) === 0 ? '<span class="chip">Tạm dừng</span>' : ''}</div><div class="mut">${fq[r.frequency] || ''} ${when} · ${esc(r.category)} · ${esc(a ? a.name : '?')}${r.last_run ? ' · gần nhất ' + r.last_run : ''}</div></div><div class="r ${r.type === 'income' ? 'inc' : 'exp'}">${r.type === 'income' ? '+' : '−'}${vnd(r.amount)}</div></div>`;
  }).join('') : '<div class="empty">Chưa có khoản định kỳ nào (tiền nhà, Netflix, lương…)</div>'}</div>`;
}

function viewSet() {
  const cat = t => S.Categories.filter(c => c.type === t).map(c => `<span class="chip" style="margin:3px;padding:5px 10px;font-size:13px">${esc(c.name)} <a href="#" data-act="catdel" data-id="${c.id}" style="color:var(--exp);text-decoration:none">✕</a></span>`).join('');
  return `<h2 style="margin-bottom:10px">Cài đặt</h2><div class="grid g2">
  <div class="card"><h3>Kết nối Google Sheet</h3>
    <label>URL Web App (Apps Script)</label><input id="sUrl" value="${esc(cfg.url || '')}" placeholder="https://script.google.com/macros/s/.../exec">
    <label>API Token</label><input id="sTok" type="password" value="${esc(cfg.token || '')}">
    <div class="row" style="margin-top:12px"><button class="btn" data-act="cfgsave">Lưu & kiểm tra</button><button class="btn ghost" data-act="logout">Xóa cấu hình trên máy này</button></div></div>
  <div class="card"><h3>Danh mục</h3><div class="mut">Chi tiêu</div>${cat('expense')}<div class="mut" style="margin-top:8px">Thu nhập</div>${cat('income')}
    <div style="margin-top:12px"><button class="btn sm" data-act="catnew">+ Thêm danh mục</button></div></div>
  <div class="card install" id="installCard"><h3>📲 Cài app lên điện thoại</h3>
    <div class="mut" id="installTxt">${installHelp()}</div>
    ${deferredInstall ? '<button class="btn" style="margin-top:10px" data-act="install">Cài đặt</button>' : ''}</div>
  <div class="card"><h3>Sao lưu</h3><div class="mut" style="margin-bottom:8px">Dữ liệu gốc nằm ở Google Sheet của bạn. Có thể tải thêm bản JSON:</div><button class="btn ghost" data-act="export">⬇ Tải bản sao lưu JSON</button></div></div>`;
}

/* ============ RENDER ============ */
function render() {
  killCharts();
  renderTabs();
  const v = ui.view, el = $('#view');
  el.innerHTML = ({ dash: viewDash, tx: viewTx, acc: viewAcc, debt: viewDebt, person: viewPerson, bud: viewBud, rec: viewRec, set: viewSet })[v]();
  $('#fab').style.display = ['dash', 'tx'].includes(v) ? 'block' : 'none';
  if (v === 'dash') dashCharts();
  const ic = $('#installCard'); if (ic && !isStandalone()) ic.style.display = 'block';
}

/* ============ SỰ KIỆN ============ */
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-go],[data-m],[data-act]'); if (!t) return;
  if (t.tagName === 'A') e.preventDefault();
  if (t.dataset.go) return go(t.dataset.go);
  if (t.dataset.m) { shiftMonth(Number(t.dataset.m)); return render(); }
  const id = t.dataset.id, act = t.dataset.act;
  if (act === 'catdel') e.preventDefault();
  try {
    switch (act) {
      case 'more': return moreSheet();
      case 'install': return doInstall();
      case 'txedit': return txForm(S.Transactions.find(x => x.id === id));
      case 'accnew': return accForm();
      case 'accedit': return accForm(accById(id));
      case 'debtnew': return debtForm();
      case 'debtf': ui.debtF = id; return render();
      case 'person': return go('person', id);
      case 'back': return history.length > 1 ? history.back() : go('debt');
      case 'ppay': return personPayForm(personByKey(ui.person), id);
      case 'padd': { const p = personByKey(ui.person); return debtForm(null, { person: p.name, direction: id }); }
      case 'debtedit': return debtForm(debtById(id));
      case 'paynew': return payForm(debtById(id));
      case 'payedit': { const p = S.DebtPayments.find(x => x.id === id); return payForm(debtById(p.debt_id), p); }
      case 'budnew': return budgetForm();
      case 'budedit': return budgetForm(S.Budgets.find(x => x.id === id));
      case 'recnew': return recForm();
      case 'recedit': return recForm(S.Recurring.find(x => x.id === id));
      case 'recrun': { const r = await api('runRecurring'); toast('Đã tạo ' + r.created + ' giao dịch định kỳ'); return loadAll(true); }
      case 'catnew': return catForm();
      case 'catdel': { const c = S.Categories.find(x => x.id === id); if (confirm('Xóa danh mục "' + c.name + '"? (giao dịch cũ vẫn giữ nguyên)')) await del('Categories', id); return; }
      case 'cfgsave': {
        cfg = { url: $('#sUrl').value.trim(), token: $('#sTok').value.trim() };
        localStorage.setItem('fin_cfg', JSON.stringify(cfg));
        await api('ping'); toast('Kết nối thành công'); return loadAll();
      }
      case 'logout': if (confirm('Xóa URL, token và dữ liệu cache trên thiết bị này?')) { localStorage.removeItem('fin_cfg'); localStorage.removeItem('fin_cache'); location.reload(); } return;
      case 'export': {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' }));
        a.download = 'tai-chinh-backup-' + todayStr() + '.json'; a.click(); return;
      }
    }
  } catch (err) { toast(err.message, true); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'mpick' && t.value) { ui.month = t.value; render(); }
  else if (t.id === 'fAcc') { ui.f.acc = t.value; render(); }
  else if (t.id === 'fType') { ui.f.type = t.value; render(); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'fQ') {
    ui.f.q = e.target.value; const pos = e.target.selectionStart;
    clearTimeout(input_t); input_t = setTimeout(() => { render(); const q = $('#fQ'); if (q) { q.focus(); q.setSelectionRange(pos, pos); } }, 250);
  }
});
let input_t;
$('#fab').onclick = () => txForm();
$('#btnReload').onclick = () => loadAll();

/* ============ PWA ============ */
let deferredInstall = null;
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
function installHelp() {
  if (deferredInstall) return 'Bấm nút bên dưới để thêm app vào màn hình chính. App sẽ mở toàn màn hình như ứng dụng thật.';
  if (isIOS()) return 'Trên iPhone/iPad: mở trang này bằng <b>Safari</b> → bấm nút <b>Chia sẻ</b> (ô vuông có mũi tên lên) → <b>Thêm vào MH chính</b>.';
  return 'Trên Android (Chrome): bấm menu <b>⋮</b> → <b>Cài đặt ứng dụng</b> / <b>Thêm vào màn hình chính</b>.';
}
async function doInstall() {
  if (!deferredInstall) return;
  deferredInstall.prompt();
  await deferredInstall.userChoice.catch(() => {});
  deferredInstall = null; render();
}
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; if (ui.view === 'set') render(); });
window.addEventListener('appinstalled', () => { deferredInstall = null; toast('Đã cài app'); });
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
// App mở lâu ở nền: quay lại thì tự đồng bộ (tối đa 1 lần / phút)
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && cfg.url && cfg.token && Date.now() - lastSync > 60000) loadAll(true);
});
window.addEventListener('online', () => { if (cfg.url && cfg.token) loadAll(true); });

/* ============ KHỞI ĐỘNG ============ */
(function init() {
  try { const c = JSON.parse(localStorage.getItem('fin_cache') || 'null'); if (c) KEYS.forEach(k => S[k] = c[k] || []); } catch (e) {}
  if (!cfg.url || !cfg.token) {
    ui.view = 'set'; render(); try { history.replaceState({ v: 'set' }, ''); } catch (e) {}
    toast('Nhập URL Web App và token để bắt đầu');
    return;
  }
  try { history.replaceState({ v: ui.view }, ''); } catch (e) {}
  render(); loadAll();
})();
</script>
</body>
</html>
